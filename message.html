<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交流留言 | 云滇风物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans SC',sans-serif;}
        h1,h2,h3{font-family:'Noto Serif SC',serif;}
        :root{
            --main:#2A5B57;
            --accent:#A64B2A;
            --bg:#F2EBDF;
            --text:#2C2C2C;
            --text-light:#666;
            --light:#E5E0D4;
        }
        body{background:var(--bg);color:var(--text);padding-top:70px;}
        nav{width:100%;position:fixed;top:0;padding:1.2rem 5rem;display:flex;justify-content:space-between;align-items:center;background:rgba(42,91,87,0.95);z-index:999;}
        .logo{font-family:'Noto Serif SC',serif;font-size:1.5rem;color:#fff;font-weight:bold;}
        .nav-links a{color:#fff;text-decoration:none;margin-left:2rem;transition:0.3s;}
        .nav-links a:hover{color:var(--accent);}
        .container{max-width:1100px;margin:0 auto;padding:3rem 2rem;}
        .page-title{text-align:center;margin-bottom:3rem;}
        .wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;}
        .form-box{background:#fff;padding:2rem;border-radius:8px;}
        .form-item{margin-bottom:1.2rem;}
        label{display:block;margin-bottom:0.5rem;color:var(--main);}
        input,textarea{width:100%;padding:0.8rem;border:1px solid var(--light);border-radius:2px;font-size:1rem;}
        textarea{min-height:140px;resize:none;}
        button{padding:0.8rem 2rem;background:var(--main);color:#fff;border:none;border-radius:2px;cursor:pointer;transition:0.3s;}
        button:hover{background:var(--accent);}
        .msg-list{background:#fff;padding:2rem;border-radius:8px;}
        .msg-item{padding:1rem;border-bottom:1px solid var(--light);margin-bottom:1rem;}
        .msg-name{font-weight:bold;color:var(--main);}
        footer{background:var(--main);color:#fff;text-align:center;padding:2rem;margin-top:4rem;}
    </style>
</head>
<body>
    <nav>
        <div class="logo">云滇风物</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="list.html">非遗名录</a>
            <a href="gallery.html">风物图集</a>
            <a href="article.html">文化科普</a>
            <a href="message.html">交流留言</a>
            <a href="about.html">关于我们</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-title">
            <h1>风物闲谈</h1>
            <p>留下你的感受，一起交流云南非遗文化</p>
        </div>
        <div class="wrap">
            <div class="form-box">
                <div class="form-item">
                    <label>昵称</label>
                    <input type="text" id="name" placeholder="请输入昵称">
                </div>
                <div class="form-item">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱">
                </div>
                <div class="form-item">
                    <label>留言内容</label>
                    <textarea id="msg" placeholder="写下你对云南非遗的感受"></textarea>
                </div>
                <button id="submitBtn">提交留言</button>
            </div>
            <div class="msg-list">
                <h3 style="margin-bottom:1.5rem;color:var(--main);">留言展示</h3>
                <div class="msg-item">
                    <div class="msg-name">小杨</div>
                    <p>扎染的蓝白色真的很治愈，希望更多人了解这项手艺。</p>
                </div>
                <div class="msg-item">
                    <div class="msg-name">阿琳</div>
                    <p>云南非遗种类丰富，数字化展示是很好的保护方式。</p>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>云滇风物 ©2026 云南非遗文化展示网站 | 毕业设计作品</p>
    </footer>
<script>
    //前端表单校验
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.onclick = ()=>{
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const msg = document.getElementById('msg').value.trim();
        if(!name){alert("请填写昵称");return;}
        if(!/^\w+([.-]?\w+)*@\w+([.-]?\w+)*(\.\w{2,3})+$/.test(email)){alert("邮箱格式错误");return;}
        if(!msg){alert("请填写留言");return;}
        alert("留言提交成功（模拟）");
    }
</script>
</body>
</html>
