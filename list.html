<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非遗名录 | 云滇风物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans SC',sans-serif;}
        h1,h2,h3{font-family:'Noto Serif SC',serif;}
        :root{
            --main:#2A5B57;
            --accent:#A64B2A;
            --bg:#F2EBDF;
            --text:#2C2C2C;
            --text-light:#666;
            --light:#E5E0D4;
        }
        body{background:var(--bg);color:var(--text);padding-top:70px;}
        nav{width:100%;position:fixed;top:0;padding:1.2rem 5rem;display:flex;justify-content:space-between;align-items:center;background:rgba(42,91,87,0.95);z-index:999;}
        .logo{font-family:'Noto Serif SC',serif;font-size:1.5rem;color:#fff;font-weight:bold;}
        .nav-links a{color:#fff;text-decoration:none;margin-left:2rem;transition:0.3s;}
        .nav-links a:hover{color:var(--accent);}
        .container{max-width:1200px;margin:0 auto;padding:3rem 2rem;}
        .page-title{text-align:center;margin-bottom:2rem;}
        .filter{display:flex;gap:1rem;justify-content:center;margin-bottom:3rem;flex-wrap:wrap;}
        .filter button{padding:0.6rem 1.2rem;border:1px solid var(--main);background:transparent;color:var(--main);border-radius:2px;cursor:pointer;transition:0.3s;}
        .filter button.active,.filter button:hover{background:var(--main);color:#fff;}
        .card-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;}
        .card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px #00000015;transition:0.3s;}
        .card:hover{transform:translateY(-8px);}
        .card img{width:100%;height:200px;object-fit:cover;}
        .card-body{padding:1.2rem;}
        .card-body h3{color:var(--main);margin-bottom:0.5rem;}
        .card-body p{color:var(--text-light);margin-bottom:1rem;font-size:0.9rem;}
        footer{background:var(--main);color:#fff;text-align:center;padding:2rem;margin-top:4rem;}
    </style>
</head>
<body>
    <nav>
        <div class="logo">云滇风物</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="list.html">非遗名录</a>
            <a href="gallery.html">风物图集</a>
            <a href="article.html">文化科普</a>
            <a href="message.html">交流留言</a>
            <a href="about.html">关于我们</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-title">
            <h1>非遗名录</h1>
            <p>探索云南各民族传统手工技艺</p>
        </div>
        <div class="filter">
            <button class="active" data-type="all">全部</button>
            <button data-type="cloth">织染刺绣</button>
            <button data-type="metal">金属工艺</button>
            <button data-type="paper">剪纸版画</button>
        </div>
        <div class="card-wrap">
            <div class="card" data-cate="cloth">
                <img src="https://picsum.photos/id/102/600/400">
                <div class="card-body">
                    <h3>白族扎染</h3>
                    <p>大理白族，草木染色，蓝白纹样</p>
                    <a href="detail.html" class="btn" style="padding:0.5rem 1rem;background:var(--main);color:#fff;text-decoration:none;border-radius:2px;">查看详情</a>
                </div>
            </div>
            <div class="card" data-cate="metal">
                <img src="https://picsum.photos/id/104/600/400">
                <div class="card-body">
                    <h3>云南斑铜</h3>
                    <p>金属锻造，独特斑驳肌理</p>
                    <a href="detail.html" class="btn" style="padding:0.5rem 1rem;background:var(--main);color:#fff;text-decoration:none;border-radius:2px;">查看详情</a>
                </div>
            </div>
            <div class="card" data-cate="paper">
                <img src="https://picsum.photos/id/106/600/400">
                <div class="card-body">
                    <h3>傣族剪纸</h3>
                    <p>西双版纳傣族民俗艺术</p>
                    <a href="detail.html" class="btn" style="padding:0.5rem 1rem;background:var(--main);color:#fff;text-decoration:none;border-radius:2px;">查看详情</a>
                </div>
            </div>
            <div class="card" data-cate="cloth">
                <img src="https://picsum.photos/id/108/600/400">
                <div class="card-body">
                    <h3>彝族刺绣</h3>
                    <p>色彩浓烈，民族图腾纹样</p>
                    <a href="detail.html" class="btn" style="padding:0.5rem 1rem;background:var(--main);color:#fff;text-decoration:none;border-radius:2px;">查看详情</a>
                </div>
            </div>
            <div class="card" data-cate="paper">
                <img src="https://picsum.photos/id/110/600/400">
                <div class="card-body">
                    <h3>白族甲马</h3>
                    <p>木刻版画，民间祭祀版画艺术</p>
                    <a href="detail.html" class="btn" style="padding:0.5rem 1rem;background:var(--main);color:#fff;text-decoration:none;border-radius:2px;">查看详情</a>
                </div>
            </div>
            <div class="card" data-cate="cloth">
                <img src="https://picsum.photos/id/112/600/400">
                <div class="card-body">
                    <h3>哈尼梯田农耕</h3>
                    <p>人与自然共生的农耕文化</p>
                    <a href="detail.html" class="btn" style="padding:0.5rem 1rem;background:var(--main);color:#fff;text-decoration:none;border-radius:2px;">查看详情</a>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>云滇风物 ©2026 云南非遗文化展示网站 | 毕业设计作品</p>
    </footer>
<script>
    //筛选功能
    const filterBtns = document.querySelectorAll('.filter button');
    const cards = document.querySelectorAll('.card');
    filterBtns.forEach(btn=>{
        btn.onclick = ()=>{
            filterBtns.forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const type = btn.dataset.type;
            cards.forEach(card=>{
                if(type==='all' || card.dataset.cate===type){
                    card.style.display='block';
                }else{
                    card.style.display='none';
                }
            })
        }
    })
</script>
</body>
</html>
