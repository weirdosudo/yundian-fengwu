<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风物图集 | 云滇风物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans SC',sans-serif;}
        h1,h2,h3{font-family:'Noto Serif SC',serif;}
        :root{
            --main:#2A5B57;
            --accent:#A64B2A;
            --bg:#F2EBDF;
            --text:#2C2C2C;
            --text-light:#666;
            --light:#E5E0D4;
        }
        body{background:var(--bg);color:var(--text);padding-top:70px;}
        nav{width:100%;position:fixed;top:0;padding:1.2rem 5rem;display:flex;justify-content:space-between;align-items:center;background:rgba(42,91,87,0.95);z-index:999;}
        .logo{font-family:'Noto Serif SC',serif;font-size:1.5rem;color:#fff;font-weight:bold;}
        .nav-links a{color:#fff;text-decoration:none;margin-left:2rem;transition:0.3s;}
        .nav-links a:hover{color:var(--accent);}
        .container{max-width:1200px;margin:0 auto;padding:3rem 2rem;}
        .page-title{text-align:center;margin-bottom:2rem;}
        .filter{display:flex;gap:1rem;justify-content:center;margin-bottom:3rem;flex-wrap:wrap;}
        .filter button{padding:0.6rem 1.2rem;border:1px solid var(--main);background:transparent;color:var(--main);border-radius:2px;cursor:pointer;transition:0.3s;}
        .filter button.active,.filter button:hover{background:var(--main);color:#fff;}
        .masonry{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
        .masonry-item img{width:100%;border-radius:4px;cursor:pointer;transition:0.3s;}
        .masonry-item img:hover{opacity:0.85;}
        /* 图片弹窗 */
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9999;}
        .modal img{max-width:90%;max-height:90%;}
        .modal.active{display:flex;}
        footer{background:var(--main);color:#fff;text-align:center;padding:2rem;margin-top:4rem;}
    </style>
</head>
<body>
    <nav>
        <div class="logo">云滇风物</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="list.html">非遗名录</a>
            <a href="gallery.html">风物图集</a>
            <a href="article.html">文化科普</a>
            <a href="message.html">交流留言</a>
            <a href="about.html">关于我们</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-title">
            <h1>风物图集</h1>
            <p>非遗作品、民族纹样与工艺纪实</p>
        </div>
        <div class="filter">
            <button class="active" data-c="all">全部</button>
            <button data-c="craft">工艺作品</button>
            <button data-c="pattern">民族纹样</button>
            <button data-c="scene">匠人场景</button>
        </div>
        <div class="masonry">
            <div class="masonry-item" data-cate="craft"><img src="https://picsum.photos/id/102/600/800"></div>
            <div class="masonry-item" data-cate="pattern"><img src="https://picsum.photos/id/104/600/500"></div>
            <div class="masonry-item" data-cate="scene"><img src="https://picsum.photos/id/106/600/700"></div>
            <div class="masonry-item" data-cate="craft"><img src="https://picsum.photos/id/108/600/600"></div>
            <div class="masonry-item" data-cate="pattern"><img src="https://picsum.photos/id/110/600/900"></div>
            <div class="masonry-item" data-cate="scene"><img src="https://picsum.photos/id/112/600/550"></div>
        </div>
    </div>
    <div class="modal" id="imgModal">
        <img id="modalImg">
    </div>
    <footer>
        <p>云滇风物 ©2026 云南非遗文化展示网站 | 毕业设计作品</p>
    </footer>
<script>
    //图集筛选
    const filterBtns = document.querySelectorAll('.filter button');
    const items = document.querySelectorAll('.masonry-item');
    filterBtns.forEach(b=>{
        b.onclick = ()=>{
            filterBtns.forEach(x=>x.classList.remove('active'));
            b.classList.add('active');
            const c = b.dataset.c;
            items.forEach(i=>{
                if(c==='all' || i.dataset.cate===c) i.style.display='block';
                else i.style.display='none';
            })
        }
    })
    //图片弹窗预览
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    const imgs = document.querySelectorAll('.masonry-item img');
    imgs.forEach(img=>{
        img.onclick = ()=>{
            modalImg.src = img.src;
            modal.classList.add('active');
        }
    })
    modal.onclick = ()=> modal.classList.remove('active');
</script>
</body>
</html>
